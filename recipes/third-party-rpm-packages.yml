# Third-party RPM packages

modules:
  # hblock
  - type: dnf
    repos:
      copr:
        - pesader/hblock
    install:
      packages:
        - hblock

  # showmethekey
  - type: dnf
    repos:
      copr:
        - pesader/showmethekey
    install:
      packages:
        - showmethekey

  # VS Code
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      files:
        - vscode.repo
    install:
      packages:
        - code
