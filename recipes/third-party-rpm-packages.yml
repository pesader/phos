# Third-party RPM packages

modules:
  # hblock
  - type: dnf
    repos:
      copr:
        - pesader/hblock
    install:
      packages:
        - hblock

  # showmethekey
  - type: dnf
    repos:
      copr:
        - pesader/showmethekey
    install:
      packages:
        - showmethekey

  # VS Code
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      files:
        - vscode.repo
    install:
      packages:
        - code

  # Voxtype
  - type: dnf
    install:
      packages:
        - https://github.com/peteonrails/voxtype/releases/download/v1.1.1/voxtype-1.1.1-1.x86_64.rpm
        - gtk4-layer-shell
